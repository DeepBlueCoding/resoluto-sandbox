name: Publish Package

# Version-routed release via PyPI Trusted Publishing (OIDC — no stored API tokens).
#   Tag  vX.Y.Z (bare)                                  → PyPI       (final release)
#   Any other v* tag (v0.2.0-rc1, v0.2.0rc1, v0.2.0.dev3) → TestPyPI   (pre-release / dev)
# One-time setup (per package, done on the PyPI websites — see the
# `publishing-and-docs` skill): register this repo+workflow as a Trusted
# Publisher on pypi.org AND test.pypi.org, and create GitHub environments
# `pypi` and `testpypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --dev
      - name: Test
        run: uv run pytest -q -m "not integration"   # integration tests need live k3s+Kata (not available on CI runners)

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.route.outputs.index }}
    steps:
      - name: Route by tag (only a bare vX.Y.Z is a final release)
        id: route
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "index=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "index=testpypi" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.index == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/resoluto-sandbox
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/resoluto-sandbox
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
